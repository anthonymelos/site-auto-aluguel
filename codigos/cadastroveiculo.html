<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastroveiculo.css">
    <title>Cadastre seu veículo</title>
</head>
<body>
    <div class="container">
        <h2>Cadastre seu veículo</h2>
        <form>
            <input type="text" placeholder="Nome do veículo" required>
            <input type="number" placeholder="Ano do veículo" required>
            <input type="text" placeholder="Placa" required>
            <input type="number" placeholder="Quilometragem rodada" required>
            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #27ae60;
        }

    </style>
</body>

<!--BACKEND-->
<script>
  document.getElementById("form-veiculo").addEventListener("submit", function(e){
    e.preventDefault();
    const modelo = document.getElementById("modelo").value;
    const marca = document.getElementById("marca").value;
    const ano = document.getElementById("ano").value;
    const preco = document.getElementById("preco").value;

    firebase.database().ref("veiculos").push({
      modelo,
      marca,
      ano,
      preco
    }).then(() => {
      alert("Veículo cadastrado!");
    });
  });
</script>
</html>
