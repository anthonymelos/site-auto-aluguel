<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atendimento - AutoAluguel</title>
  <link rel="stylesheet" href="estilo.css" />
</head>
<body>

  <main>
    <div id="telaatendimento">
      <h2>Atendimento ao Usuário</h2>
      <form action="#" method="post">
        <label for="email">Seu e-mail:</label><br />
        <input type="email" id="email" name="email" required /><br /><br />

        <label for="mensagem">O que você deseja?</label><br />
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea><br /><br />

        <button type="submit">Enviar</button>
      </form>
    </div>
  </main>

  <style>
    div#telaatendimento {
        width: 350px;
        padding: 20px;
        margin: 30px auto;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        text-align: left;
    }

    #telaatendimento h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    #telaatendimento input,
    #telaatendimento textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    #telaatendimento button {
        margin-top: 10px;
        width: 100%;
        padding: 10px;
        background-color: #2d89e5;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    #telaatendimento button:hover {
        background-color: #1b65b8;
    }

  </style>
</body>
</html>
